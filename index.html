<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Webidex</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#08080C;display:flex;flex-direction:column;align-items:center;font-family:system-ui,sans-serif;position:relative;overflow-x:hidden}
/* EMPIRE CODE BACKGROUND - BLACK SILK + DENSE GOLD STARS */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
background:
radial-gradient(ellipse at 10% 20%, rgba(255,215,0,0.9) 0 1.8px, transparent 2.2px),
radial-gradient(ellipse at 18% 78%, rgba(255,215,0,0.8) 0 1.5px, transparent 2px),
radial-gradient(ellipse at 30% 30%, rgba(212,175,55,1) 0 2.2px, transparent 2.8px),
radial-gradient(ellipse at 45% 15%, rgba(255,215,0,1) 0 2.5px, transparent 3.2px),
radial-gradient(ellipse at 60% 25%, rgba(255,215,0,0.9) 0 1.6px, transparent 2.1px),
radial-gradient(ellipse at 75% 18%, rgba(255,215,0,1) 0 3px, transparent 4px),
radial-gradient(ellipse at 82% 55%, rgba(212,175,55,0.9) 0 1.8px, transparent 2.3px),
radial-gradient(ellipse at 88% 80%, rgba(255,215,0,1) 0 2.2px, transparent 3px),
radial-gradient(ellipse at 50% 85%, rgba(255,215,0,0.9) 0 2px, transparent 2.7px),
radial-gradient(ellipse at 22% 50%, rgba(255,215,0,0.7) 0 1.2px, transparent 1.7px),
radial-gradient(ellipse at 92% 10%, rgba(255,215,0,0.7) 0 1.2px, transparent 1.7px),
radial-gradient(ellipse at 5% 90%, rgba(255,215,0,0.8) 0 1.4px, transparent 1.9px),
radial-gradient(ellipse at 65% 70%, rgba(255,215,0,0.9) 0 1.8px, transparent 2.3px),
radial-gradient(ellipse at 40% 60%, rgba(255,215,0,0.85) 0 1.6px, transparent 2.1px),
radial-gradient(ellipse at 15% 40%, rgba(212,175,55,0.9) 0 1.5px, transparent 2px),
/* BIG GLITTER STARS */
radial-gradient(circle at 12% 25%, #FFD700 0 0.5px, rgba(255,215,0,0.8) 0.5px 2.5px, transparent 4px),
radial-gradient(circle at 38% 22%, #FFD700 0 0.5px, rgba(255,215,0,0.7) 0.5px 3px, transparent 5px),
radial-gradient(circle at 72% 38%, #FFE55C 0 0.5px, rgba(255,215,0,0.8) 0.5px 2.8px, transparent 4.5px),
radial-gradient(circle at 85% 22%, #FFD700 0 0.5px, rgba(255,215,0,0.8) 0.5px 2.2px, transparent 4px),
radial-gradient(circle at 48% 78%, #FFD700 0 0.5px, rgba(255,215,0,0.9) 0.5px 3.2px, transparent 5.5px),
radial-gradient(circle at 90% 65%, #FFD700 0 0.5px, rgba(255,215,0,0.7) 0.5px 2.5px, transparent 4.2px),
/* SILK FABRIC WAVES */
linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.03) 25%, transparent 40%, rgba(255,255,255,0.02) 60%, transparent 85%),
linear-gradient(0deg, #08080C 0%, #0F0F14 50%, #08080C 100%);
}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:
radial-gradient(circle at 20% 30%, rgba(255,215,0,0.15) 0 1px, transparent 1px),
radial-gradient(circle at 50% 50%, rgba(255,215,0,0.12) 0 1px, transparent 1px),
radial-gradient(circle at 80% 20%, rgba(255,215,0,0.1) 0 1px, transparent 1px);
background-size: 180px 180px, 220px 220px, 300px 300px;
opacity:0.6;
}

.waitlist-gate{position:fixed;inset:0;background:#08080C;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}
.waitlist-gate::before{content:"";position:absolute;inset:0;background:inherit;background-image:inherit;filter:inherit}
.waitlist-gate::before{content:"";position:absolute;inset:0;
background:
radial-gradient(circle at 12% 25%, #FFD700 0 0.5px, rgba(255,215,0,0.8) 0.5px 2.5px, transparent 4px),
radial-gradient(circle at 38% 22%, #FFD700 0 0.5px, rgba(255,215,0,0.7) 0.5px 3px, transparent 5px),
radial-gradient(circle at 72% 38%, #FFE55C 0 0.5px, rgba(255,215,0,0.8) 0.5px 2.8px, transparent 4.5px),
radial-gradient(circle at 85% 22%, #FFD700 0 0.5px, rgba(255,215,0,0.8) 0.5px 2.2px, transparent 4px),
radial-gradient(circle at 48% 78%, #FFD700 0 0.5px, rgba(255,215,0,0.9) 0.5px 3.2px, transparent 5.5px),
radial-gradient(ellipse at 10% 20%, rgba(255,215,0,0.9) 0 1.8px, transparent 2.2px),
radial-gradient(ellipse at 30% 30%, rgba(212,175,55,1) 0 2.2px, transparent 2.8px),
radial-gradient(ellipse at 75% 18%, rgba(255,215,0,1) 0 3px, transparent 4px),
radial-gradient(ellipse at 88% 80%, rgba(255,215,0,1) 0 2.2px, transparent 3px);
opacity:1;
}
.gate-card{width:min(420px,92%);background:#FFFBF2;border:1px solid #EADFC5;border-radius:24px;padding:34px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.7);position:relative;z-index:1}
.gate-logo{width:52px;height:52px;background:#111;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#D4AF37;font-weight:900;font-size:26px;margin:0 auto 16px}
.gate-title{font-size:27px;font-weight:800;color:#111;margin:0 0 10px}
.gate-sub{font-size:14px;color:#555;line-height:1.6;margin:0 0 22px}
.gate-badge{display:inline-block;background:#FFF3CD;border:1px solid #FFD700;color:#111;padding:6px 14px;border-radius:999px;font-size:11px;font-weight:800;margin-bottom:16px}
.gate-cta{display:block;width:100%;background:#111;color:white;padding:14px;border-radius:999px;text-decoration:none;font-weight:800}
.new-topbar{width:min(1150px,94%);margin:22px auto 0;background:#FFFBF2;border:1px solid #EADFC5;border-radius:18px;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:relative;z-index:1;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.new-container{width:min(1150px,94%);margin:22px auto 50px;display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start;position:relative;z-index:1}
.new-panel-code{background:#FFFBF2;border:1px solid #EADFC5;border-radius:18px;overflow:hidden;box-shadow:0 15px 50px rgba(0,0,0,0.6);height:720px;display:flex;flex-direction:column}
.new-panel-deploy{background:#FFFBF2;border:1px solid #EADFC5;border-radius:18px;overflow:hidden;box-shadow:0 15px 50px rgba(0,0,0,0.6);padding:20px;display:flex;flex-direction:column;gap:16px;height:fit-content}
.new-tabs{display:flex;gap:8px;padding:12px 16px;background:#FFF8EB;border-bottom:1px solid #EDE5D3}.new-tab{border-radius:999px;padding:7px 14px;border:1px solid #E5DDC8;background:#FFFBF0;font-weight:600;cursor:pointer}.new-tab.active{background:#111;color:white}
.old-btn{border:1px solid #E5DDC8;border-radius:999px;padding:10px 15px;cursor:pointer;font-weight:600;background:#FFFBF0}
.hidden{display:none!important}
@media(max-width:900px){.new-container{grid-template-columns:1fr}.new-panel-code{height:560px}}
</style></head><body>
<div id="gate" class="waitlist-gate"><div class="gate-card"><div class="gate-logo">W</div><div class="gate-badge">✨ LUXURY BUILDER</div><h1 class="gate-title">Webidex is coming soon</h1><p class="gate-sub">First 30 users can get <b>free access forever</b></p><a class="gate-cta" href="https://forms.gle/TVdL6k5CvrteFB4B8" target="_blank">Join Waiting List →</a></div></div>
<div id="newUI" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
<header class="new-topbar"><div style="display:flex;gap:10px;align-items:center"><div style="width:40px;height:40px;background:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#D4AF37;font-weight:900">W</div><b>Webidex</b></div><button class="old-btn" onclick="localStorage.removeItem('webidex_admin');location.href=location.pathname">Exit Admin</button></header>
<main class="new-container">
<div class="new-panel-code"><div style="padding:14px 18px;display:flex;justify-content:space-between;font-weight:700;border-bottom:1px solid #EDE5D3">index.html <span style="background:#10B981;color:white;padding:3px 10px;border-radius:999px;font-size:11px">HTML</span></div><div style="flex:1;position:relative"><textarea id="codeEditorNew" style="position:absolute;inset:0;width:100%;height:100%;border:0;padding:14px;font-family:monospace;font-size:13px" placeholder="Paste code..."></textarea><iframe id="previewNew" style="position:absolute;inset:0;width:100%;height:100%;border:0;display:none"></iframe></div><div style="padding:10px;background:#F5EEE0;border-top:1px solid #EDE5D3;display:flex;gap:8px"><button class="old-btn" id="saveBtnNew">Save</button><button class="old-btn" onclick="let e=document.getElementById('codeEditorNew'),p=document.getElementById('previewNew');p.srcdoc=e.value;p.style.display='block'">Preview</button></div></div>
<div class="new-panel-deploy"><button id="deployBtnNew" style="width:100%;background:#111;color:white;border-radius:999px;padding:16px;font-size:18px;font-weight:700;border:0">Deploy</button><div style="font-size:13px;color:#666;text-align:center">Go live in 1.2s • Admin mode</div><input id="siteNameNew" placeholder="My Website" style="width:100%;padding:12px;border:1px solid #E5DDC8;border-radius:12px"><div id="liveUrlNew" style="color:#2563EB;font-size:12px;word-break:break-all;background:#FFF8EB;padding:10px;border-radius:10px;border:1px dashed #E5DDC8">https://my-website.webidex.app</div></div>
</main>
</div>
<script>
(function(){let p=new URLSearchParams(location.search);if(p.get('key')==='webidex_91_x_mast3r_2026'){localStorage.setItem('webidex_admin','yes');history.replaceState({},'',location.pathname)}let a=localStorage.getItem('webidex_admin')==='yes';document.getElementById('gate').classList.toggle('hidden',a);document.getElementById('newUI').classList.toggle('hidden',!a)})();
document.getElementById('saveBtnNew').onclick=()=>{localStorage.setItem('forge_current_project',JSON.stringify({name:document.getElementById('siteNameNew').value,code:document.getElementById('codeEditorNew').value}));alert('Saved')};
document.getElementById('deployBtnNew').onclick=async()=>{let code=document.getElementById('codeEditorNew').value,name=document.getElementById('siteNameNew').value||'website';if(!code.trim()){alert('Enter code');return}let res=await fetch('/api/deploy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,name})});let d=await res.json();if(!res.ok){alert(d.error);return}document.getElementById('liveUrlNew').textContent=d.url;window.open(d.url,'_blank')};
</script></body></html>
