<!DOCTYPE html> <html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge</title> <style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0b0f19;
    color:#e5e7eb;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,
input,
textarea{
    font:inherit;
}

.topbar{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#0d111c;
    border-bottom:1px solid #202737;
}

.logo{
    font-size:21px;
    font-weight:700;
}

.logo span{
    color:#8b5cf6;
}

.topbar-right{
    color:#8b93a7;
    font-size:13px;
}

.container{
    width:min(1250px,100%);
    margin:auto;
    padding:28px 18px 50px;
}

.heading{
    margin-bottom:22px;
}

.heading h1{
    margin:0 0 7px;
    font-size:28px;
}

.heading p{
    margin:0;
    color:#8b93a7;
    font-size:14px;
}

.project-bar{
    display:flex;
    gap:12px;
    align-items:end;
    background:#111827;
    border:1px solid #202737;
    border-radius:12px;
    padding:16px;
    margin-bottom:18px;
}

.project-name-wrap{
    flex:1;
}

.project-name-wrap label{
    display:block;
    font-size:12px;
    color:#9ca6ba;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:11px 12px;
    background:#0b0f19;
    color:white;
    border:1px solid #30394d;
    border-radius:8px;
    outline:none;
}

input:focus{
    border-color:#8b5cf6;
}

.workspace{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.panel{
    min-width:0;
    background:#111827;
    border:1px solid #202737;
    border-radius:12px;
    overflow:hidden;
}

.panel-head{
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    border-bottom:1px solid #202737;
}

.panel-title{
    font-size:13px;
    font-weight:600;
}

.panel-info{
    font-size:12px;
    color:#717b91;
}

textarea{
    display:block;
    width:100%;
    height:560px;
    resize:vertical;
    border:0;
    outline:0;
    padding:16px;
    background:#080c14;
    color:#dbe3f0;
    font-family:"Courier New",monospace;
    font-size:13px;
    line-height:1.55;
}

iframe{
    display:block;
    width:100%;
    height:560px;
    border:0;
    background:white;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:16px;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 15px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
}

.primary{
    background:#7c3aed;
    color:white;
}

.primary:hover{
    background:#6d28d9;
}

.secondary{
    background:#202737;
    color:#e5e7eb;
}

.secondary:hover{
    background:#2b3549;
}

.danger{
    background:#3b1d25;
    color:#fca5a5;
}

.deploy-panel{
    margin-top:18px;
    padding:20px;
    background:#111827;
    border:1px solid #202737;
    border-radius:12px;
}

.deploy-panel h2{
    margin:0 0 6px;
    font-size:18px;
}

.deploy-panel p{
    margin:0;
    color:#8b93a7;
    font-size:13px;
    line-height:1.5;
}

.deploy-box{
    margin-top:15px;
    padding:13px;
    border:1px solid #202737;
    background:#0b0f19;
    border-radius:8px;
    color:#9ca6ba;
    font-size:13px;
}

.live-url{
    margin-top:10px;
    padding:12px;
    border-radius:8px;
    background:#0b0f19;
    border:1px solid #263149;
    display:none;
    word-break:break-all;
}

.live-url a{
    color:#a78bfa;
}

.toast{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    background:#1f2937;
    color:white;
    border:1px solid #374151;
    padding:11px 16px;
    border-radius:8px;
    font-size:13px;
    display:none;
    z-index:9999;
}

@media(max-width:850px){

   .workspace{
        grid-template-columns:1fr;
    }

    textarea,
    iframe{
        height:450px;
    }

   .project-bar{
        flex-direction:column;
        align-items:stretch;
    }

   .topbar{
        padding:0 15px;
    }

   .topbar-right{
        display:none;
    }
}
</style> </head> <body> <header class="topbar"> <div class="logo">
    Forge<span>.</span>
</div>

<div class="topbar-right">
    Website Builder
</div>

</header> <main class="container"> <div class="heading">

    <h1>Create your website</h1>

    <p>
        Write or paste your website code and preview the exact result.
    </p>

</div>

<section class="project-bar">

    <div class="project-name-wrap">

        <label for="siteName">
            Website name
        </label>

        <input
            id="siteName"
            type="text"
            placeholder="My Website"
            autocomplete="off"
        >

    </div>

    <button
        class="secondary"
        id="saveBtn"
    >
        Save
    </button>

</section>

<section class="workspace">

    <!-- CODE EDITOR -->

    <div class="panel">

        <div class="panel-head">

            <div class="panel-title">
                Code
            </div>

            <div
                class="panel-info"
                id="codeStatus"
            >
                Ready
            </div>

        </div>

        <textarea
            id="codeEditor"
            spellcheck="false"
            placeholder="Paste your complete HTML code here..."
        ></textarea>

    </div>

    <!-- PREVIEW -->

    <div class="panel">

        <div class="panel-head">

            <div class="panel-title">
                Preview
            </div>

            <div
                class="panel-info"
                id="previewStatus"
            >
                Waiting for code
            </div>

        </div>

        <iframe
            id="preview"
            title="Website Preview"
            sandbox="allow-scripts allow-forms allow-modals allow-popups"
        ></iframe>

    </div>

</section>

<div class="actions">

    <button
        class="primary"
        id="previewBtn"
    >
        Preview Website
    </button>

    <button
        class="secondary"
        id="downloadBtn"
    >
        Download HTML
    </button>

    <button
        class="danger"
        id="clearBtn"
    >
        Clear
    </button>

</div>

<section class="deploy-panel">

    <h2>
        Deployment
    </h2>

    <p>
        This is where Forge will send your website to the deployment
        backend and return the real live URL.
    </p>

    <div
        class="deploy-box"
        id="deployStatus"
    >
        Deployment backend not connected yet.
    </div>

    <div
        class="live-url"
        id="liveUrl"
    ></div>

    <div class="actions">

        <button
            class="primary"
            id="deployBtn"
        >
            Deploy Website
        </button>

    </div>

</section>

</main> <div
    class="toast"
    id="toast"
></div> <script>

/* =========================================
   ELEMENTS
========================================= */

const codeEditor =
    document.getElementById("codeEditor");

const preview =
    document.getElementById("preview");

const siteName =
    document.getElementById("siteName");

const codeStatus =
    document.getElementById("codeStatus");

const previewStatus =
    document.getElementById("previewStatus");

const deployStatus =
    document.getElementById("deployStatus");

const liveUrl =
    document.getElementById("liveUrl");

const toast =
    document.getElementById("toast");

/* =========================================
   TOAST
========================================= */

function showToast(message){

    toast.textContent = message;
    toast.style.display = "block";

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(function(){

            toast.style.display = "none";

        },2200);
}

/* =========================================
   PREVIEW
========================================= */

function previewWebsite(){

    let code =
        codeEditor.value;

    if(!code.trim()){

        previewStatus.textContent =
            "No code";

        preview.srcdoc =
            `
            <html>
            <body style="
                margin:0;
                min-height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                font-family:Arial;
                color:#555;
            ">
                <div>
                    <h2>No website code</h2>
                    <p>Paste your HTML code into the editor.</p>
                </div>
            </body>
            </html>
            `;

        return;
    }

    let finalCode = code;

    if(
        code.includes("export default") ||
        code.includes("className=")
    ){
        finalCode =
            finalCode.replace(
                /export default function App\(\)[\s\S]*?return\s*\(/,
                ""
            );

        finalCode =
            finalCode.replace(
                /\)\s*\}\s*\}\s*;?\s*$/,
                ""
            );

        finalCode =
            finalCode.replace(
                /\}\s*\)\s*\}\s*$/,
                ""
            );

        finalCode =
            finalCode.replace(
                /className=/g,
                "class="
            );

        finalCode =
            "<!DOCTYPE html><html><head>" +
            "<meta charset='UTF-8'>" +
            "<meta name='viewport' content='width=device-width, initial-scale=1.0'>" +
            "<script src='https://cdn.tailwindcss.com'></" + "script>" +
            "</head><body>" +
            finalCode +
            "</body></html>";
    }

    preview.srcdoc = finalCode;

    previewStatus.textContent =
        "Preview loaded";

    showToast(
        "Your website preview is updated."
    );
}

/* =========================================
   SAVE
========================================= */

function saveWebsite(){

    const data = {

        name:
            siteName.value.trim() ||
            "My Website",

        code:
            codeEditor.value,

        savedAt:
            new Date().toISOString()

    };

    localStorage.setItem(
        "forge_current_project",
        JSON.stringify(data)
    );

    codeStatus.textContent =
        "Saved";

    showToast(
        "Saved on this device."
    );
}

/* =========================================
   LOAD
========================================= */

function loadWebsite(){

    const saved =
        localStorage.getItem(
            "forge_current_project"
        );

    if(!saved){

        codeStatus.textContent =
            "Ready";

        return;
    }

    try{

        const data =
            JSON.parse(saved);

        if(data.name){

            siteName.value =
                data.name;
        }

        if(data.code){

            codeEditor.value =
                data.code;
        }

        codeStatus.textContent =
            "Saved";

        /*
           Automatically show the saved website
           when the builder opens again.
        */

        if(data.code){

            preview.srcdoc =
                data.code;

            previewStatus.textContent =
                "Preview loaded";
        }

    }catch(error){

        console.error(
            "Save data could not be loaded:",
            error
        );

    }

}

/* =========================================
   DOWNLOAD HTML
========================================= */

function downloadWebsite(){

    const code =
        codeEditor.value;

    if(!code.trim()){

        showToast(
            "There is no code to download."
        );

        return;
    }

    let filename =
        siteName.value.trim() ||
        "my-website";

    filename =
        filename
       .replace(/[^a-z0-9-_]/gi,"-")
       .toLowerCase();

    const blob =
        new Blob(
            [code],
            {
                type:"text/html"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href =
        url;

    link.download =
        filename + ".html";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

    showToast(
        "HTML file downloaded."
    );
}

/* =========================================
   CLEAR
========================================= */

function clearWebsite(){

    const confirmed =
        confirm(
            "Clear the current website code?"
        );

    if(!confirmed){

        return;
    }

    codeEditor.value = "";
    siteName.value = "";

    localStorage.removeItem(
        "forge_current_project"
    );

    preview.srcdoc = "";

    codeStatus.textContent =
        "Ready";

    previewStatus.textContent =
        "Waiting for code";

    showToast(
        "Website cleared."
    );
}

/* =========================================
   DEPLOY
========================================= */

function deployWebsite(){
  const codeEl = document.getElementById("codeEditor");
  const code = codeEl? codeEl.value : "";
  if(!code.trim()){
    alert("Paste code first");
    return;
  }
  const blob = new Blob([code], {type:"text/html"});
  const url = URL.createObjectURL(blob);

  const statusEl = document.getElementById("deployStatus");
  const liveUrlEl = document.getElementById("liveUrl");

  if(statusEl){
    statusEl.textContent = "● Live - Deployed ✓";
    statusEl.style.color = "#63d39b";
  }
  if(liveUrlEl){
    liveUrlEl.href = url;
    liveUrlEl.textContent = url;
    liveUrlEl.style.display = "block";
  }
  window.open(url, "_blank");

  try{
    let users = JSON.parse(localStorage.getItem("forge_users")||"{}");
    let sess = localStorage.getItem("forge_session");
    if(users[sess]){
      let p = users[sess].projects.find(x=>x.id===currentProjectId);
      if(p) p.deployed = true;
      localStorage.setItem("forge_users", JSON.stringify(users));
    }
  }catch(e){}
}

/* =========================================
   BUTTON EVENTS
========================================= */

document
   .getElementById("previewBtn")
   .addEventListener(
        "click",
        previewWebsite
    );

document
   .getElementById("saveBtn")
   .addEventListener(
        "click",
        saveWebsite
    );

document
   .getElementById("downloadBtn")
   .addEventListener(
        "click",
        downloadWebsite
    );

document
   .getElementById("clearBtn")
   .addEventListener(
        "click",
        clearWebsite
    );

document
   .getElementById("deployBtn")
   .addEventListener(
        "click",
        deployWebsite
    );

/* =========================================
   CODE CHANGE DETECTION
========================================= */

codeEditor.addEventListener(
    "input",
    function(){

        codeStatus.textContent =
            "Unsaved";

    }
);

/* =========================================
   START
========================================= */

loadWebsite();

</script>
</body>
</html>
