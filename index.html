<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Webidex - Luxury Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--cream:#FFFBF2;--border:#E9E0C8;--gold:#FFD700}
body{min-height:100vh;background:#050507;font-family:Inter,system-ui;overflow-x:hidden}
#starCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.silk{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 800px 600px at 15% 20%,rgba(255,215,0,0.10),transparent 60%),radial-gradient(ellipse 600px 800px at 85% 30%,rgba(255,215,0,0.08),transparent 60%)}
.glass-shell{position:relative;z-index:2;width:min(1280px,96%);margin:20px auto 70px;background:linear-gradient(180deg,rgba(255,251,242,0.22) 0%,rgba(255,251,242,0.08) 100%);backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);border:1px solid rgba(255,255,255,0.35);border-top:1px solid rgba(255,255,255,0.75);border-radius:28px;padding:22px;box-shadow:inset 0 1px 1px rgba(255,255,255,0.9),0 30px 90px rgba(0,0,0,0.85)}
.glass-shell::before{content:"";position:absolute;top:0;left:1%;right:1%;height:55%;background:linear-gradient(180deg,rgba(255,255,255,0.4) 0%,rgba(255,255,255,0.12) 18%,transparent 70%);border-radius:28px 28px 100% 100% / 28px 28px 60% 60%;pointer-events:none}
.topbar{width:100%;height:70px;background:var(--cream);border:1px solid var(--border);border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.main{width:100%;margin-top:18px;display:grid;grid-template-columns:1fr 390px;gap:20px;align-items:start}
.code-panel{background:var(--cream);border:1px solid var(--border);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;height:700px}
.deploy-panel{background:var(--cream);border:1px solid var(--border);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;position:relative}
.deploy-btn{width:100%;background:#0F0F0F;color:white;border:0;border-radius:999px;padding:18px;font-size:18px;font-weight:700;cursor:pointer;transition:0.2s}
.deploy-btn:disabled{background:#D6CEB8;color:#8B7D60;cursor:not-allowed}
.hidden{display:none!important}.tab{padding:8px 16px;border-radius:999px;border:1px solid #E5DDC8;background:white;font-weight:600;font-size:13px;cursor:pointer}.tab.active{background:#111;color:white}
.login-page{position:fixed;inset:0;z-index:10000;background:#050507;display:flex;align-items:center;justify-content:center;padding:20px}
.projects-page{position:fixed;inset:0;z-index:60;background:rgba(5,5,7,0.96);backdrop-filter:blur(16px);display:none;flex-direction:column;align-items:center;padding:30px 20px;overflow:auto}
@media(max-width:900px){.main{grid-template-columns:1fr}.code-panel{height:560px}}
</style>
</head>
<body>
<canvas id="starCanvas"></canvas><div class="silk"></div>

<div id="loginPage" class="login-page">
<canvas id="loginCanvas" style="position:absolute;inset:0"></canvas>
<div style="position:relative;z-index:1;width:min(400px,92%);background:var(--cream);border-radius:24px;padding:32px;text-align:center">
<div style="width:56px;height:56px;background:#111;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#D4AF37;font-weight:900;font-size:28px;margin:0 auto 16px">W</div>
<h2 style="font-weight:800">Login to Webidex</h2><p style="font-size:13px;color:#666;margin:8px 0 20px">Your projects will be saved forever</p>
<input id="gmailInput" placeholder="Enter your Gmail" style="width:100%;padding:12px;border:1px solid #E5DDC8;border-radius:12px;margin-bottom:12px">
<button id="loginBtn" style="width:100%;padding:13px;background:#111;color:white;border-radius:999px;border:0;font-weight:700;cursor:pointer">Continue →</button>
</div>
</div>

<div id="projectsPage" class="projects-page">
<div style="width:min(1000px,96%)">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h2 style="color:white;font-size:24px;font-weight:800">Your Projects</h2><button id="closeProjects" style="padding:8px 16px;border-radius:999px;background:white;border:0;font-weight:600;cursor:pointer">Close ✕</button></div>
<div id="projectsList"></div>
<div id="projectDetail" style="display:none;background:var(--cream);border-radius:20px;overflow:hidden;margin-top:20px">
<div style="padding:20px;border-bottom:1px solid #E5DDC8;display:flex;justify-content:space-between;align-items:center"><div><div id="detailName" style="font-weight:800;font-size:20px"></div><div style="display:flex;gap:8px;margin-top:6px"><span style="background:#10B981;color:white;padding:3px 10px;border-radius:999px;font-size:11px">● Live</span><span id="detailDate" style="background:#FFF8EB;border:1px solid #E5DDC8;padding:3px 10px;border-radius:999px;font-size:11px;color:#666"></span></div></div><button onclick="document.getElementById('projectDetail').style.display='none'" style="padding:8px 14px;border-radius:999px;border:1px solid #E5DDC8;background:white;cursor:pointer">Back</button></div>
<div style="display:grid;grid-template-columns:1fr 320px"><div style="padding:16px;border-right:1px solid #E5DDC8"><div style="font-size:11px;font-weight:700;color:#888;margin-bottom:8px">PREVIEW</div><iframe id="detailPreview" style="width:100%;height:400px;border:1px solid #E5DDC8;border-radius:12px;background:white"></iframe></div><div style="padding:16px;display:flex;flex-direction:column;gap:14px"><div><div style="font-size:11px;font-weight:700;color:#888">DOMAIN</div><div id="detailUrl" style="margin-top:6px;color:#2563EB;font-size:13px;word-break:break-all"></div></div><button id="detailEditBtn" style="padding:10px;border-radius:10px;border:0;background:#111;color:white;font-weight:600;cursor:pointer">Edit in Builder</button><button id="detailDeleteBtn" style="padding:10px;border-radius:10px;border:1px solid #EF4444;background:white;color:#EF4444;font-weight:600;cursor:pointer">Delete</button></div></div>
</div>
</div>
</div>

<div id="gate" class="hidden"></div>

<div id="newUI" class="hidden" style="width:100%;display:flex;justify-content:center">
<div class="glass-shell">
<header class="topbar">
<div style="display:flex;align-items:center;gap:14px"><div style="width:42px;height:42px;background:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#D4AF37;font-weight:900">W</div><div style="font-size:24px;font-weight:800">Webidex</div><button id="yourProjectsBtn" style="padding:9px 18px;border-radius:999px;border:1px solid #E5DDC8;background:white;font-weight:600;font-size:14px;cursor:pointer">Your Projects</button></div>
<div style="display:flex;align-items:center;gap:8px"><span id="userGmail" style="font-size:11px;color:#666"></span><div style="width:36px;height:36px;border-radius:50%;background:#111;color:white;display:flex;align-items:center;justify-content:center;font-weight:800">U</div></div>
</header>

<main class="main">
<div class="code-panel">
<div style="padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #EDE5D3"><span style="font-weight:700;font-size:14px">index.html</span><span style="background:#10B981;color:white;padding:3px 10px;border-radius:999px;font-size:11px">HTML</span><span id="savedBadge" style="color:#059669;font-size:13px;font-weight:600">✔ Saved</span><span id="errorBadge" style="display:none;color:#EF4444;font-size:12px;font-weight:700;margin-left:auto">⚠️ Error</span></div>
<div style="padding:12px 16px;display:flex;gap:8px;background:#FFF8EB;border-bottom:1px solid #EDE5D3"><button class="tab active" id="codeTab">Code</button><button class="tab" id="previewTab">Preview</button></div>
<div style="flex:1;position:relative;background:#FFFEFB;display:flex;overflow:hidden"><div id="gutter" style="width:48px;background:#FFF8EB;border-right:1px solid #EDE5D3;padding:12px 0;text-align:right;font-family:monospace;font-size:12px;color:#999;line-height:20px">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12<br>13<br>14<br>15</div><div style="flex:1;position:relative"><textarea id="codeEditor" spellcheck="false" style="position:absolute;inset:0;width:100%;height:100%;border:0;padding:12px;font-family:monospace;font-size:12.5px;line-height:20px;resize:none;outline:none"></textarea><iframe id="preview" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:white;display:none" sandbox="allow-scripts allow-forms allow-same-origin"></iframe></div></div>
<div style="padding:12px 16px;background:#F5EEE0;border-top:1px solid #EDE5D3;display:flex;gap:8px"><button id="saveBtn" style="padding:8px 14px;border-radius:10px;border:1px solid #E5DDC8;background:white;font-weight:600;font-size:12px;cursor:pointer">💾 Save</button><button id="downloadBtn" style="padding:8px 14px;border-radius:10px;border:1px solid #E5DDC8;background:white;font-weight:600;font-size:12px;cursor:pointer">⬇ Download</button><button id="clearBtn" style="padding:8px 14px;border-radius:10px;border:1px solid #E5DDC8;background:white;font-weight:600;font-size:12px;cursor:pointer">🗑 Clear</button><span id="codeSavedTag" style="margin-left:auto;color:#059669;font-size:12px;font-weight:600;display:none">✔ Code Saved</span></div>
</div>

<div class="deploy-panel">
<button class="deploy-btn" id="deployBtn" disabled>Save Name First</button>
<div style="background:#FFF8EB;border:1px dashed #E5DDC8;border-radius:14px;padding:12px">
<div style="font-size:11px;font-weight:700;color:#8B7D60;margin-bottom:8px">PROJECT NAME *</div>
<div style="display:flex;gap:8px"><input id="siteName" placeholder="my-awesome-site" style="flex:1;padding:11px;border:1px solid #E5DDC8;border-radius:10px;font-size:14px;outline:none"><button id="saveNameBtn" style="padding:11px 18px;border-radius:10px;background:#111;color:white;border:0;font-weight:700;font-size:12px;cursor:pointer">Save</button></div>
<div id="nameSavedTag" style="font-size:11px;color:#059669;margin-top:8px;display:none">✔ Saved: <b id="savedNameText"></b></div>
</div>
<div><div style="font-size:12px;font-weight:600;color:#555;margin-bottom:6px">Live URL</div><div style="display:flex;gap:8px;background:#FFF8EB;border:1px solid #EDE5D3;border-radius:10px;padding:8px 10px"><a id="liveUrl" href="#" target="_blank" style="flex:1;font-size:12px;color:#2563EB;word-break:break-all;text-decoration:none">Deploy to get URL</a><button id="copyBtn" style="padding:6px 10px;border-radius:8px;border:1px solid #E5DDC8;background:white;font-size:11px;font-weight:600;cursor:pointer">Copy</button></div></div>
<div id="status" style="font-size:11px;color:#666;text-align:center;min-height:14px"></div>
</div>
</main>
</div>
</div>

<script>
function drawStars(id,count){let c=document.getElementById(id);if(!c)return;let ctx=c.getContext('2d');function rs(){c.width=innerWidth;c.height=innerHeight;ctx.clearRect(0,0,c.width,c.height);for(let i=0;i<count;i++){let x=Math.random()*c.width,y=Math.random()*c.height,r=Math.random()*2.2+0.3,a=Math.random()*0.9+0.15,col=`rgba(255,${200+Math.random()*55},${Math.random()*80},${a})`;ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fillStyle=col;ctx.fill()}}rs();addEventListener('resize',rs)}drawStars('starCanvas',600);drawStars('loginCanvas',300);
let isNameSaved=false,isCodeSaved=false,currentName='';
const codeEl=document.getElementById('codeEditor'),gutter=document.getElementById('gutter'),preview=document.getElementById('preview'),siteEl=document.getElementById('siteName'),liveEl=document.getElementById('liveUrl'),loginPage=document.getElementById('loginPage'),newUI=document.getElementById('newUI');
function checkLogin(){let g=localStorage.getItem('webidex_user_gmail');if(g){loginPage.style.display='none';newUI.classList.remove('hidden');document.getElementById('userGmail').textContent=g;load()}else{loginPage.style.display='flex';newUI.classList.add('hidden')}}checkLogin();
document.getElementById('loginBtn').onclick=()=>{let v=document.getElementById('gmailInput').value.trim();if(!v.includes('@'))return alert('Enter valid Gmail');localStorage.setItem('webidex_user_gmail',v);checkLogin()};
function updateGutter(){let l=codeEl.value.split('\n').length;if(l<15)l=15;let h='';for(let i=1;i<=l;i++)h+=i+'<br>';gutter.innerHTML=h}
function saveCurrent(){localStorage.setItem('forge_current_project',JSON.stringify({name:siteEl.value,code:codeEl.value,nameSaved:isNameSaved,codeSaved:isCodeSaved,realName:currentName}))}
function checkDeploy(){let b=document.getElementById('deployBtn');if(isNameSaved&&isCodeSaved){b.disabled=false;b.textContent='Deploy → '+currentName+'.webidex.app'}else{b.disabled=true;b.textContent=!isNameSaved?'Save Name First':'Save Code to Deploy'}}
function load(){let s=localStorage.getItem('forge_current_project');if(s){try{let d=JSON.parse(s);codeEl.value=d.code||'';siteEl.value=d.name||'';currentName=d.realName||d.name||'';isNameSaved=!!d.nameSaved;isCodeSaved=!!d.codeSaved;if(isNameSaved){document.getElementById('nameSavedTag').style.display='block';document.getElementById('savedNameText').textContent=currentName}if(isCodeSaved)document.getElementById('codeSavedTag').style.display='block';}catch{}}if(!codeEl.value)codeEl.value=`<!DOCTYPE html>\n<html><head><meta charset="UTF-8"><title>My Site</title></head><body><h1>Hello Webidex</h1></body></html>`;updateGutter();checkDeploy()}
document.getElementById('saveNameBtn').onclick=()=>{let n=siteEl.value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/--+/g,'-');if(!n||n.length<3)return alert('Enter min 3 chars');currentName=n;siteEl.value=n;isNameSaved=true;document.getElementById('nameSavedTag').style.display='block';document.getElementById('savedNameText').textContent=n;saveCurrent();checkDeploy()};
document.getElementById('saveBtn').onclick=()=>{if(!codeEl.value.trim())return alert('Write code');isCodeSaved=true;document.getElementById('codeSavedTag').style.display='block';saveCurrent();checkDeploy()};
document.getElementById('downloadBtn').onclick=()=>{let b=new Blob([codeEl.value],{type:'text/html'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(currentName||'site')+'.html';a.click()};
document.getElementById('clearBtn').onclick=()=>{if(confirm('Clear?')){codeEl.value='';isCodeSaved=false;document.getElementById('codeSavedTag').style.display='none';updateGutter();saveCurrent();checkDeploy()}};
function showCode(){codeEl.style.display='block';preview.style.display='none';document.getElementById('codeTab').classList.add('active');document.getElementById('previewTab').classList.remove('active')}
function showPreview(){try{preview.srcdoc=codeEl.value;preview.style.display='block';codeEl.style.display='none';document.getElementById('previewTab').classList.add('active');document.getElementById('codeTab').classList.remove('active');document.getElementById('errorBadge').style.display='none'}catch(e){document.getElementById('errorBadge').style.display='inline';document.getElementById('errorBadge').textContent='⚠️ '+e.message}}
document.getElementById('codeTab').onclick=showCode;document.getElementById('previewTab').onclick=showPreview;
document.getElementById('deployBtn').onclick=async()=>{if(!isNameSaved||!isCodeSaved)return;let btn=document.getElementById('deployBtn');btn.textContent='Deploying...';btn.disabled=true;let name=currentName;try{let r=await fetch('/api/deploy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:codeEl.value,name})});let d=await r.json();if(!r.ok)throw new Error(d.error);let clean=`https://${name}.webidex.app`;liveEl.textContent=clean;liveEl.href=d.url;let projects=JSON.parse(localStorage.getItem('webidex_projects')||'[]');projects.unshift({name,url:clean,realUrl:d.url,code:codeEl.value,date:new Date().toLocaleString()});localStorage.setItem('webidex_projects',JSON.stringify(projects));document.getElementById('status').textContent='Live!';window.open(d.url,'_blank')}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent='Deploy → '+name+'.webidex.app'}};
document.getElementById('copyBtn').onclick=()=>{navigator.clipboard.writeText(liveEl.textContent);let b=document.getElementById('copyBtn');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1200)};
document.getElementById('yourProjectsBtn').onclick=()=>{renderProjects();document.getElementById('projectsPage').style.display='flex'};
document.getElementById('closeProjects').onclick=()=>document.getElementById('projectsPage').style.display='none';
function renderProjects(){let list=document.getElementById('projectsList');let projects=JSON.parse(localStorage.getItem('webidex_projects')||'[]');if(!projects.length){list.innerHTML='<div style="color:#999;text-align:center;margin:40px">No projects yet</div>';return}list.innerHTML=projects.map((p,i)=>`<div style="background:var(--cream);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;cursor:pointer" onclick="openProject(${i})"><div><div style="font-weight:700">${p.name}.webidex.app</div><div style="font-size:11px;color:#888">${p.date}</div></div><div style="color:#2563EB;font-size:12px">Open →</div></div>`).join('')}
window.openProject=(i)=>{let projects=JSON.parse(localStorage.getItem('webidex_projects')||'[]');let p=projects[i];document.getElementById('projectDetail').style.display='block';document.getElementById('detailName').textContent=p.name+'.webidex.app';document.getElementById('detailDate').textContent=p.date;document.getElementById('detailUrl').textContent=p.url;document.getElementById('detailPreview').srcdoc=p.code;document.getElementById('detailEditBtn').onclick=()=>{document.getElementById('projectsPage').style.display='none';siteEl.value=p.name;codeEl.value=p.code;currentName=p.name;isNameSaved=true;isCodeSaved=true;updateGutter();saveCurrent();checkDeploy()};document.getElementById('detailDeleteBtn').onclick=()=>{if(confirm('Delete?')){projects.splice(i,1);localStorage.setItem('webidex_projects',JSON.stringify(projects));renderProjects();document.getElementById('projectDetail').style.display='none'}}};
codeEl.addEventListener('input',()=>{updateGutter();isCodeSaved=false;document.getElementById('codeSavedTag').style.display='none';saveCurrent();checkDeploy()});
</script>
</body>
</html>
