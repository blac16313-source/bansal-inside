<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Webidex</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;background:#050508;background-image:radial-gradient(circle at 15% 20%, #FFD700 0 2.5px, transparent 3px),radial-gradient(circle at 70% 15%, #D4AF37 0 2.5px, transparent 3px),radial-gradient(circle at 80% 60%, #FFD700 0 2px, transparent 2.5px),radial-gradient(circle at 50% 85%, #FFD700 0 2.5px, transparent 3px);background-attachment:fixed;font-family:system-ui,sans-serif}
.waitlist-gate{position:fixed;inset:0;background:#050508;background-image:radial-gradient(circle at 15% 20%, #FFD700 0 2.5px, transparent 3px),radial-gradient(circle at 70% 15%, #D4AF37 0 2.5px, transparent 3px),radial-gradient(circle at 80% 60%, #FFD700 0 2px, transparent 2.5px),radial-gradient(circle at 50% 85%, #FFD700 0 2.5px, transparent 3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}
.gate-card{width:min(420px,92%);background:#FFFBF2;border:1px solid #EADFC5;border-radius:24px;padding:34px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.7)}
.gate-logo{width:52px;height:52px;background:#111;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#D4AF37;font-weight:900;font-size:26px;margin:0 auto 16px}
.gate-title{font-size:27px;font-weight:800;color:#111;margin:0 0 10px;line-height:1.2}
.gate-sub{font-size:14px;color:#555;line-height:1.6;margin:0 0 22px}
.gate-badge{display:inline-block;background:#FFF3CD;border:1px solid #FFD700;color:#111;padding:6px 14px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:0.5px;margin-bottom:16px}
.gate-cta{display:block;width:100%;background:#111;color:white;padding:14px;border-radius:999px;text-decoration:none;font-weight:800;font-size:15px}

/* FIXED ADMIN UI */
.new-topbar{width:min(1280px,96%);margin:16px auto 0;background:#FFFBF0;border:1px solid #EADFC5;border-radius:20px;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.new-container{width:min(1280px,96%);margin:24px auto 50px;display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start;flex:1}
.new-panel-code{background:#FFFBF2;border:1px solid #EADFC5;border-radius:22px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,0.45);height:620px;display:flex;flex-direction:column}
.new-panel-deploy{background:#FFFBF2;border:1px solid #EADFC5;border-radius:22px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,0.45);padding:22px;display:flex;flex-direction:column;gap:18px;height:auto}
.new-tabs{display:flex;gap:8px;padding:12px 16px;background:#FFF8EB;border-bottom:1px solid #EDE5D3}.new-tab{border-radius:999px;padding:7px 14px;border:1px solid #E5DDC8;background:#FFFBF0;font-weight:600;cursor:pointer}.new-tab.active{background:#111;color:white}
.old-btn{border:0;border-radius:999px;padding:10px 15px;cursor:pointer;font-weight:600;background:#FFFBF0;border:1px solid #E5DDC8}
.hidden{display:none!important}
@media(max-width:900px){.new-container{grid-template-columns:1fr}.new-panel-code{height:500px}.new-panel-deploy{height:auto}}
</style></head><body id="body">

<div id="gate" class="waitlist-gate">
  <div class="gate-card">
    <div class="gate-logo">W</div>
    <div class="gate-badge">✨ LUXURY BUILDER</div>
    <h1 class="gate-title">Webidex is coming soon</h1>
    <p class="gate-sub">First 30 users can get <b style="color:#111">free access forever</b></p>
    <a class="gate-cta" href="https://forms.gle/TVdL6k5CvrteFB4B8" target="_blank">Join Waiting List →</a>
  </div>
</div>

<div id="newUI" class="hidden">
<header class="new-topbar"><div style="display:flex;gap:10px;align-items:center"><div style="width:42px;height:42px;background:#111;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#D4AF37;font-weight:900;font-size:22px">W</div><div style="font-weight:700;font-size:26px">Webidex</div></div><button class="old-btn" onclick="localStorage.removeItem('webidex_admin');location.href=location.pathname">Exit Admin</button></header>
<main class="new-container">
<!-- CODE PANEL -->
<div class="new-panel-code"><div style="padding:16px 18px;display:flex;justify-content:space-between;border-bottom:1px solid #EDE5D3;font-weight:700">index.html <span style="background:#10B981;color:white;padding:3px 10px;border-radius:999px;font-size:11px">HTML</span></div><div class="new-tabs"><button class="new-tab active" id="codeBtnNew">Code</button><button class="new-tab" id="previewTabBtnNew">Preview</button><button class="old-btn" id="saveBtnNew" style="margin-left:auto">Save</button></div><div style="flex:1;position:relative;background:white"><textarea id="codeEditorNew" style="position:absolute;inset:0;width:100%;height:100%;border:0;padding:16px;font-family:monospace;font-size:13px;resize:none" placeholder="Paste code..."></textarea><iframe id="previewNew" style="position:absolute;inset:0;width:100%;height:100%;border:0;display:none" sandbox="allow-scripts allow-forms"></iframe></div><div style="padding:12px 14px;background:#F5EEE0;border-top:1px solid #EDE5D3;display:flex;gap:10px"><button class="old-btn" id="downloadBtnNew">⬇ Download</button><button class="old-btn" id="clearBtnNew">🗑 Clear</button></div></div>
<!-- DEPLOY PANEL - NOW COMPACT FIXED -->
<div class="new-panel-deploy">
  <button id="deployBtnNew" style="width:100%;background:#111;color:white;border-radius:999px;padding:16px;font-size:18px;font-weight:700;cursor:pointer;border:0">Deploy</button>
  <div style="font-size:13px;color:#666;text-align:center">Go live in 1.2s • Admin mode</div>
  <input id="siteNameNew" placeholder="My Website" style="width:100%;padding:12px 14px;border:1px solid #E5DDC8;border-radius:12px;font-size:14px">
  <div id="liveUrlNew" style="color:#2563EB;font-size:13px;word-break:break-all;background:#FFF8EB;padding:10px 12px;border-radius:10px;border:1px dashed #E5DDC8">https://my-website.webidex.app</div>
</div>
</main>
</div>

<script>
(function(){
  let p=new URLSearchParams(location.search);
  if(p.get('key')==='webidex_91_x_mast3r_2026'){localStorage.setItem('webidex_admin','yes'); history.replaceState({},'',location.pathname);}
  let isAdmin=localStorage.getItem('webidex_admin')==='yes';
  if(isAdmin){
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('newUI').classList.remove('hidden');
  }else{
    document.getElementById('gate').classList.remove('hidden');
    document.getElementById('newUI').classList.add('hidden');
  }
})();
function setup(){
  const codeEl=document.getElementById("codeEditorNew"), prevEl=document.getElementById("previewNew"), siteEl=document.getElementById("siteNameNew");
  function load(){let s=localStorage.getItem("forge_current_project");if(s){try{let d=JSON.parse(s);if(d.code){siteEl.value=d.name||"";codeEl.value=d.code||"";prevEl.srcdoc=d.code||"";}}catch(e){}}}
  function save(){localStorage.setItem("forge_current_project",JSON.stringify({name:siteEl.value,code:codeEl.value}));}
  function previewF(){prevEl.srcdoc=codeEl.value||"<h2 style='text-align:center'>No code</h2>"; prevEl.style.display='block';codeEl.style.display='none';}
  function download(){let blob=new Blob([codeEl.value],{type:"text/html"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(siteEl.value||"website")+".html";a.click();}
  function clear(){codeEl.value="";siteEl.value="";localStorage.removeItem("forge_current_project");prevEl.srcdoc="";codeEl.style.display='block';prevEl.style.display='none';}
  async function deploy(){try{let code=codeEl.value,name=siteEl.value||"website";if(!code.trim()){alert("Enter code");return}let res=await fetch("/api/deploy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,name})});let data=await res.json();if(!res.ok)throw new Error(data.error);alert("Deployed!");window.open(data.url,"_blank");document.getElementById("liveUrlNew").textContent=data.url;}catch(e){alert(e.message)}}
  document.getElementById("saveBtnNew").onclick=save; document.getElementById("codeBtnNew").onclick=()=>{codeEl.style.display='block';prevEl.style.display='none';}; document.getElementById("previewTabBtnNew").onclick=previewF; document.getElementById("downloadBtnNew").onclick=download; document.getElementById("clearBtnNew").onclick=clear; document.getElementById("deployBtnNew").onclick=deploy; load();
}
setup();
</script></body></html>
