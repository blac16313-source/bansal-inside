<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Webidex</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:#0A0A0F;display:flex;flex-direction:column;align-items:center;font-family:system-ui,sans-serif;position:relative}
body::before{content:"";position:fixed;inset:0;background:
radial-gradient(circle at 15% 20%, #FFD700 0 2px, transparent 3px),
radial-gradient(circle at 70% 20%, #FFD700 0 2px, transparent 3px),
radial-gradient(circle at 40% 80%, #FFD700 0 2px, transparent 3px),
radial-gradient(circle at 85% 70%, #FFD700 0 2px, transparent 3px);pointer-events:none;z-index:0}
.waitlist-gate{position:fixed;inset:0;background:#0A0A0F;display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.gate-card{width:min(420px,92%);background:#FFFBF2;border:1px solid #EADFC5;border-radius:24px;padding:34px 28px;text-align:center}
.gate-cta{display:block;width:100%;background:#111;color:white;padding:14px;border-radius:999px;text-decoration:none;font-weight:800}
.topbar{width:min(1220px,95%);height:72px;margin:18px auto 0;background:#FFFBF2;border:1px solid #EADFC5;border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:relative;z-index:1;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.container{width:min(1220px,95%);margin:18px auto 40px;display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start;position:relative;z-index:1}
.panel-code{background:#FFFBF2;border:1px solid #EADFC5;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,0.5);display:flex;flex-direction:column;height:640px}
.panel-deploy{background:#FFFBF2;border:1px solid #EADFC5;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;height:fit-content;box-shadow:0 12px 40px rgba(0,0,0,0.5)}
.code-head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #EDE5D3;font-weight:700;font-size:14px}
.tabs{padding:10px 14px;display:flex;gap:8px;align-items:center;background:#FFF8EB;border-bottom:1px solid #EDE5D3}
.tab{padding:7px 14px;border-radius:999px;border:1px solid #E5DDC8;background:#FFFBF0;font-weight:600;font-size:13px;cursor:pointer}
.tab.active{background:#111;color:white;border-color:#111}
.bottom-bar{padding:10px 12px;display:flex;gap:8px;background:#F5EEE0;border-top:1px solid #EDE5D3}
.btn{padding:8px 14px;border-radius:999px;border:1px solid #E5DDC8;background:#FFFBF0;font-weight:600;font-size:12px;cursor:pointer}
.hidden{display:none!important}
@media(max-width:900px){.container{grid-template-columns:1fr}.panel-code{height:560px}}
</style></head><body>

<div id="gate" class="waitlist-gate"><div class="gate-card"><div style="width:48px;height:48px;background:#111;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#D4AF37;font-weight:900;margin:0 auto 12px">W</div><h2>Webidex is coming soon</h2><p style="color:#666;font-size:14px">First 30 users free forever</p><a class="gate-cta" href="https://forms.gle/TVdL6k5CvrteFB4B8" target="_blank">Join Waiting List →</a></div></div>

<div id="newUI" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
<header class="topbar">
<div style="display:flex;gap:10px;align-items:center"><div style="width:36px;height:36px;background:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#D4AF37;font-weight:900">W</div><b>Webidex</b><button style="margin-left:16px;padding:8px 16px;border-radius:999px;border:1px solid #E5DDC8;background:white;font-weight:700">Your Project</button></div>
<div style="display:flex;gap:10px;align-items:center"><div style="width:36px;height:36px;background:#E8DCC0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700">U</div><button class="btn" onclick="localStorage.removeItem('webidex_admin');location.href=location.pathname">Exit Admin</button></div>
</header>

<main class="container">
<!-- CODE BOX - EXACT AS DEAL -->
<div class="panel-code">
<div class="code-head"><span>index.html</span><span style="background:#10B981;color:white;padding:4px 10px;border-radius:999px;font-size:11px">HTML</span></div>
<div class="tabs"><button class="tab active" id="codeTab">Code</button><button class="tab" id="previewTab">Preview</button><button class="btn" id="saveTopBtn" style="margin-left:auto;background:#111;color:white">Save</button></div>
<div style="flex:1;position:relative;background:white"><textarea id="codeEditor" style="position:absolute;inset:0;width:100%;height:100%;border:0;padding:14px;font-family:monospace;font-size:13px;resize:none" placeholder="Paste code..."></textarea><iframe id="preview" style="position:absolute;inset:0;width:100%;height:100%;border:0;display:none"></iframe></div>
<div class="bottom-bar"><button class="btn" id="saveBtn">Save</button><button class="btn" id="previewBottomBtn">Preview</button><button class="btn" id="downloadBtn">⬇ Download</button><button class="btn" id="clearBtn">🗑 Clear</button></div>
</div>

<!-- DEPLOY BOX -->
<div class="panel-deploy">
<button id="deployBtn" style="width:100%;background:#111;color:white;border-radius:999px;padding:16px;font-size:17px;font-weight:800;border:0;cursor:pointer">Deploy</button>
<div style="font-size:13px;color:#555;text-align:center">Ready to make your site live</div>
<input id="siteName" placeholder="My Website" style="width:100%;padding:12px 14px;border:1px solid #E5DDC8;border-radius:12px;font-size:14px">
<div id="liveUrl" style="font-size:12px;color:#2563EB;background:#FFF8EB;border:1px dashed #E5DDC8;padding:10px;border-radius:10px;word-break:break-all">https://my-website.webidex.app</div>
</div>
</main>
</div>

<script>
(function(){let p=new URLSearchParams(location.search);if(p.get('key')==='webidex_91_x_mast3r_2026'){localStorage.setItem('webidex_admin','yes');history.replaceState({},'',location.pathname)}let a=localStorage.getItem('webidex_admin')==='yes';document.getElementById('gate').classList.toggle('hidden',a);document.getElementById('newUI').classList.toggle('hidden',!a)})();
const codeEl=document.getElementById('codeEditor'), prevEl=document.getElementById('preview'), siteEl=document.getElementById('siteName'), liveEl=document.getElementById('liveUrl');
function load(){let s=localStorage.getItem('forge_current_project');if(s){try{let d=JSON.parse(s);codeEl.value=d.code||'';siteEl.value=d.name||'';prevEl.srcdoc=d.code||''}catch(e){}}}
function save(){localStorage.setItem('forge_current_project',JSON.stringify({name:siteEl.value,code:codeEl.value}));alert('Saved');}
function showCode(){codeEl.style.display='block';prevEl.style.display='none';document.getElementById('codeTab').classList.add('active');document.getElementById('previewTab').classList.remove('active')}
function showPreview(){prevEl.srcdoc=codeEl.value||'<h2 style=text-align:center>Nothing to preview</h2>';prevEl.style.display='block';codeEl.style.display='none';document.getElementById('previewTab').classList.add('active');document.getElementById('codeTab').classList.remove('active')}
function download(){let b=new Blob([codeEl.value],{type:'text/html'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(siteEl.value||'website')+'.html';a.click()}
function clear(){codeEl.value='';siteEl.value='';localStorage.removeItem('forge_current_project');showCode()}
async function deploy(){let code=codeEl.value,name=siteEl.value||'website';if(!code.trim()){alert('Enter code');return}try{let r=await fetch('/api/deploy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,name})});let d=await r.json();if(!r.ok)throw new Error(d.error);liveEl.textContent=d.url;window.open(d.url,'_blank')}catch(e){alert(e.message)}}
document.getElementById('codeTab').onclick=showCode; document.getElementById('previewTab').onclick=showPreview; document.getElementById('previewBottomBtn').onclick=showPreview;
document.getElementById('saveBtn').onclick=save; document.getElementById('saveTopBtn').onclick=save;
document.getElementById('downloadBtn').onclick=download; document.getElementById('clearBtn').onclick=clear; document.getElementById('deployBtn').onclick=deploy;
load();
</script></body></html>
